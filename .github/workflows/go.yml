name: Go
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows executable and ZIP
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: auto-yuumi-windows
          path: |
            dist/auto-yuumi.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
